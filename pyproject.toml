[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aixi-bench"
version = "0.1.0"
description = "AIXI-Complexity Benchmark: Finite-state controlled-task evaluation"
readme = "README.md"
requires-python = ">=3.12.10"
license = {text = "MIT"}
authors = [{name = "Ajinkya Awari", email = "ajinkyaawari.skncoe.comp@gmail.com"}]
keywords = ["aixi", "complexity", "benchmark", "agents", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.1",
    "torch==2.13.0",
    "transformers==5.14.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "scipy==1.18.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "pyarrow==24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[project.scripts]
aixi-bench = "aixi_bench.__main__:main"

[tool.setuptools]
packages = ["aixi_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Mean of empty slice:RuntimeWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
