name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lightweight: torch and transformers are only needed for the local Qwen arm, which the
      # tests never load, so they are not installed here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gymnasium==1.3.0 numpy==2.5.1 pandas==3.0.5 scipy==1.18.0 PyYAML==6.0.3 pytest==9.1.1 ruff==0.16.2
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
